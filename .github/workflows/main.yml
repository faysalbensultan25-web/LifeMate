
name: Build LifeMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          if [ ! -f android/gradlew ]; then
            echo "Generating Android project..."

            flutter create \
              --platforms=android \
              --project-name lifemate \
              --org com.lifemate \
              /tmp/lifemate_scaffold

            rm -rf android
            cp -R /tmp/lifemate_scaffold/android ./android
          fi

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "SDK Manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-36"
          "$SDKMANAGER" "build-tools;36.0.0"

      - name: Flutter Pub Get
        run: flutter pub get

      # Install Floating Home Button
      - name: Install Floating Home Button
        run: |
          set -e

          MAIN_ACTIVITY="android/app/src/main/kotlin/com/lifemate/lifemate/MainActivity.kt"
          FLOATING_SERVICE="android/app/src/main/kotlin/com/lifemate/lifemate/LifeMateFloatingService.kt"
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          mkdir -p "$(dirname "$MAIN_ACTIVITY")"

          # MainActivity with Flutter MethodChannel
          cat > "$MAIN_ACTIVITY" <<'KOTLIN'
          package com.lifemate.lifemate

          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {

              private val channelName = "com.lifemate/floating_home"
              private val prefsName = "lifemate_floating"
              private val enabledKey = "enabled"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      channelName
                  ).setMethodCallHandler { call, result ->

                      when (call.method) {

                          "isOverlayPermissionGranted" -> {
                              result.success(Settings.canDrawOverlays(this))
                          }

                          "requestOverlayPermission" -> {
                              openOverlaySettings()
                              result.success(true)
                          }

                          "setFloatingEnabled" -> {
                              val enabled =
                                  call.argument<Boolean>("enabled") ?: false

                              getSharedPreferences(prefsName, MODE_PRIVATE)
                                  .edit()
                                  .putBoolean(enabledKey, enabled)
                                  .apply()

                              if (enabled) {
                                  if (Settings.canDrawOverlays(this)) {
                                      startFloatingService()
                                  } else {
                                      openOverlaySettings()
                                  }
                              } else {
                                  stopService(
                                      Intent(
                                          this,
                                          LifeMateFloatingService::class.java
                                      )
                                  )
                              }

                              result.success(true)
                          }

                          else -> result.notImplemented()
                      }
                  }
              }

              override fun onResume() {
                  super.onResume()

                  val enabled =
                      getSharedPreferences(prefsName, MODE_PRIVATE)
                          .getBoolean(enabledKey, false)

                  if (enabled && Settings.canDrawOverlays(this)) {
                      startFloatingService()
                  }
              }

              private fun openOverlaySettings() {
                  if (Settings.canDrawOverlays(this)) return

                  try {
                      val intent = Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")
                      )
                      startActivity(intent)
                  } catch (_: Exception) {
                      try {
                          startActivity(
                              Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION
                              )
                          )
                      } catch (_: Exception) {
                      }
                  }
              }

              private fun startFloatingService() {
                  try {
                      val intent = Intent(
                          this,
                          LifeMateFloatingService::class.java
                      )

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(intent)
                      } else {
                          startService(intent)
                      }
                  } catch (_: Exception) {
                  }
              }
          }
          KOTLIN

          # Floating Service
          cat > "$FLOATING_SERVICE" <<'KOTLIN'
          package com.lifemate.lifemate

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.IBinder
          import android.provider.Settings
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.TextView

          class LifeMateFloatingService : Service() {

              private var windowManager: WindowManager? = null
              private var floatingView: TextView? = null

              private val channelId = "lifemate_floating_channel"
              private val notificationId = 1001

              override fun onCreate() {
                  super.onCreate()

                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf()
                      return
                  }

                  createNotificationChannel()
                  startForeground(notificationId, createNotification())
                  showFloatingButton()
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "LifeMate Floating Button",
                          NotificationManager.IMPORTANCE_LOW
                      )

                      channel.description =
                          "Keeps the LifeMate Home button available."

                      val manager =
                          getSystemService(NotificationManager::class.java)

                      manager.createNotificationChannel(channel)
                  }
              }

              private fun createNotification(): Notification {
                  return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, channelId)
                          .setContentTitle("LifeMate")
                          .setContentText("Floating Home button is active")
                          .setSmallIcon(android.R.drawable.ic_menu_view)
                          .setOngoing(true)
                          .build()
                  } else {
                      Notification.Builder(this)
                          .setContentTitle("LifeMate")
                          .setContentText("Floating Home button is active")
                          .setSmallIcon(android.R.drawable.ic_menu_view)
                          .setOngoing(true)
                          .build()
                  }
              }

              private fun showFloatingButton() {
                  if (floatingView != null) return

                  windowManager =
                      getSystemService(WINDOW_SERVICE) as WindowManager

                  val button = TextView(this)

                  button.text = "⌂"
                  button.textSize = 22f
                  button.setTextColor(Color.WHITE)
                  button.gravity = Gravity.CENTER
                  button.setPadding(0, 0, 0, 1)

                  val background = GradientDrawable()
                  background.shape = GradientDrawable.OVAL
                  background.setColor(Color.rgb(33, 150, 243))
                  background.setStroke(2, Color.WHITE)

                  button.background = background
                  button.elevation = 12f

                  val params = WindowManager.LayoutParams(
                      dp(52),
                      dp(52),
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      } else {
                          WindowManager.LayoutParams.TYPE_PHONE
                      },
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )

                  params.gravity = Gravity.CENTER_VERTICAL or Gravity.END
                  params.x = dp(4)
                  params.y = 0

                  button.setOnTouchListener(
                      object : View.OnTouchListener {

                          private var downX = 0f
                          private var downY = 0f
                          private var startX = 0
                          private var startY = 0
                          private var moved = false

                          override fun onTouch(
                              view: View,
                              event: MotionEvent
                          ): Boolean {

                              when (event.action) {
                                  MotionEvent.ACTION_DOWN -> {
                                      downX = event.rawX
                                      downY = event.rawY
                                      startX = params.x
                                      startY = params.y
                                      moved = false
                                      return true
                                  }

                                  MotionEvent.ACTION_MOVE -> {
                                      val dx = event.rawX - downX
                                      val dy = event.rawY - downY

                                      if (
                                          kotlin.math.abs(dx) > dp(8) ||
                                          kotlin.math.abs(dy) > dp(8)
                                      ) {
                                          moved = true
                                      }

                                      params.x = startX - dx.toInt()
                                      params.y = startY + dy.toInt()

                                      try {
                                          windowManager?.updateViewLayout(
                                              button,
                                              params
                                          )
                                      } catch (_: Exception) {
                                      }

                                      return true
                                  }

                                  MotionEvent.ACTION_UP -> {
                                      if (!moved) {
                                          openLifeMate()
                                      }
                                      return true
                                  }
                              }

                              return false
                          }
                      }
                  )

                  floatingView = button

                  try {
                      windowManager?.addView(button, params)
                  } catch (_: Exception) {
                      floatingView = null
                  }
              }

              private fun openLifeMate() {
                  try {
                      val intent =
                          packageManager.getLaunchIntentForPackage(packageName)

                      if (intent != null) {
                          intent.addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK or
                                  Intent.FLAG_ACTIVITY_SINGLE_TOP or
                                  Intent.FLAG_ACTIVITY_CLEAR_TOP
                          )
                          startActivity(intent)
                      }
                  } catch (_: Exception) {
                  }
              }

              private fun dp(value: Int): Int {
                  return (value * resources.displayMetrics.density).toInt()
              }

              override fun onDestroy() {
                  try {
                      floatingView?.let {
                          windowManager?.removeView(it)
                      }
                  } catch (_: Exception) {
                  }

                  floatingView = null
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? {
                  return null
              }
          }
          KOTLIN

          # AndroidManifest permissions and service
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          content = manifest.read_text()

          permissions = [
              "android.permission.SYSTEM_ALERT_WINDOW",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_SPECIAL_USE",
              "android.permission.READ_CONTACTS",
          ]

          for permission in permissions:
              permission_tag = (
                  f'<uses-permission android:name="{permission}" />'
              )

              if permission_tag not in content:
                  content = content.replace(
                      "<application",
                      f"    {permission_tag}\n    <application",
                      1
                  )

          service_block = """
              <service
                  android:name=".LifeMateFloatingService"
                  android:enabled="true"
                  android:exported="false"
                  android:foregroundServiceType="specialUse">
                  <property
                      android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                      android:value="LifeMate floating Home button overlay" />
              </service>
          """

          if "LifeMateFloatingService" not in content:
              content = content.replace(
                  "</application>",
                  service_block + "\n    </application>",
                  1
              )

          ET.fromstring(content)
          manifest.write_text(content)

          print("AndroidManifest XML validation passed.")
          print("READ_CONTACTS permission added.")
          PY

          echo "Floating Home Button and Contact Permission installed."

      # Force App compileSdk 36
      - name: Force App compileSdk 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          for file in files:
              if not file.exists():
                  continue

              content = file.read_text()

              content = re.sub(
                  r'(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(?:flutter\.compileSdkVersion|\d+)',
                  r'\g<1>36',
                  content
              )

              if not re.search(r'compileSdk(?:Version)?', content):
                  if file.suffix == ".kts":
                      content = content.replace(
                          "android {",
                          "android {\n    compileSdk = 36",
                          1
                      )
                  else:
                      content = content.replace(
                          "android {",
                          "android {\n    compileSdk 36",
                          1
                      )

              file.write_text(content)
              print("Updated:", file)
          PY

      # Force Flutter plugin compileSdk 36
      - name: Force Flutter plugin compileSdk 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import os

          pub_root = Path(
              os.path.expanduser("~/.pub-cache/hosted/pub.dev")
          )

          target_names = [
              "file_picker",
              "flutter_plugin_android_lifecycle",
          ]

          changed = []

          if pub_root.exists():
              for name in target_names:
                  for folder in pub_root.glob(f"{name}-*"):
                      android_folder = folder / "android"

                      if not android_folder.exists():
                          continue

                      for file in android_folder.glob("build.gradle*"):
                          content = file.read_text()

                          updated = re.sub(
                              r'(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(?:flutter\.compileSdkVersion|\d+)',
                              r'\g<1>36',
                              content
                          )

                          if not re.search(r'compileSdk(?:Version)?', updated):
                              if file.suffix == ".kts":
                                  updated = updated.replace(
                                      "android {",
                                      "android {\n    compileSdk = 36",
                                      1
                                  )
                              else:
                                  updated = updated.replace(
                                      "android {",
                                      "android {\n    compileSdk 36",
                                      1
                                  )

                          if updated != content:
                              file.write_text(updated)
                              changed.append(str(file))

          print("Total plugin files updated:", len(changed))
          PY

      # Verify Android configuration
      - name: Verify Android configuration
        run: |
          echo "ANDROID MANIFEST"
          cat android/app/src/main/AndroidManifest.xml

          echo "MAIN ACTIVITY"
          cat android/app/src/main/kotlin/com/lifemate/lifemate/MainActivity.kt

          echo "FLOATING SERVICE"
          cat android/app/src/main/kotlin/com/lifemate/lifemate/LifeMateFloatingService.kt

          echo "APP BUILD GRADLE"
          cat android/app/build.gradle || true
          cat android/app/build.gradle.kts || true

      - name: Flutter Clean
        run: flutter clean

      - name: Flutter Pub Get Again
        run: flutter pub get

      - name: Download Gradle dependencies
        working-directory: android
        run: |
          echo "Downloading Gradle dependencies..."

          for attempt in 1 2 3 4 5; do
            echo "Gradle dependency attempt: $attempt"

            if ./gradlew dependencies --no-daemon --stacktrace; then
              echo "Gradle dependencies downloaded successfully."
              exit 0
            fi

            echo "Attempt $attempt failed."

            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 20))
            fi
          done

          echo "Gradle dependency download failed after 5 attempts."
          exit 1

      - name: Build APK
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.parallel=true
            -Dorg.gradle.caching=true
            -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          for attempt in 1 2 3 4 5; do
            echo "APK build attempt: $attempt"

            if flutter build apk --release; then
              echo "APK build successful."
              exit 0
            fi

            echo "Build attempt $attempt failed."

            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 20))
            fi
          done

          echo "APK build failed after 5 attempts."
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeMate-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
