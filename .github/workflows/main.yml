
name: Build LifeMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android \
              --project-name lifemate \
              --org com.lifemate /tmp/lifemate_scaffold

            rm -rf android
            cp -R /tmp/lifemate_scaffold/android ./android
          fi

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "SDK Manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36"

      - name: Set App compileSdk 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for file in [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts")
          ]:
              if file.exists():
                  content = file.read_text()

                  content = re.sub(
                      r'(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(?:flutter\.compileSdkVersion|\d+)',
                      r'\g<1>36',
                      content
                  )

                  file.write_text(content)
                  print("Updated:", file)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Set Android Plugin compileSdk 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import os

          root = Path(os.path.expanduser("~/.pub-cache/hosted/pub.dev"))

          if not root.exists():
              raise SystemExit("Pub cache directory not found")

          changed = []

          for file in root.glob("*/android/build.gradle*"):
              content = file.read_text()

              updated = re.sub(
                  r'(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(?:flutter\.compileSdkVersion|\d+)',
                  r'\g<1>36',
                  content
              )

              if updated != content:
                  file.write_text(updated)
                  changed.append(str(file))

          for item in changed:
              print("Updated plugin:", item)

          print("Total Android plugin files updated:", len(changed))
          PY

      - name: Build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeMate-APK
          path: build/app/outputs/flutter-apk/app-release.apk

