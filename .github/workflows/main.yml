
name: Build LifeMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android \
              --project-name lifemate \
              --org com.lifemate /tmp/lifemate_scaffold

            rm -rf android
            cp -R /tmp/lifemate_scaffold/android ./android
          fi

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36"

      - name: Force compileSdk 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for file in [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts")
          ]:
              if file.exists():
                  content = file.read_text()
                  content = re.sub(
                      r'(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?).*$',
                      r'\g<1>36',
                      content
                  )
                  file.write_text(content)

          root_file = Path("android/build.gradle")

          if root_file.exists():
              content = root_file.read_text()

              addition = """
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          """

              if "compileSdkVersion 36" not in content:
                  root_file.write_text(content + "\n" + addition)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeMate-APK
          path: build/app/outputs/flutter-apk/app-release.apk
