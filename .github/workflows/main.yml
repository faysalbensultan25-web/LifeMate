name: Build LifeMate APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # =========================================================
      # 3. Flutter Stable
      # =========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # =========================================================
      # 4. Install Pillow
      # =========================================================
      - name: Install Python Image Library
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Pillow


      # =========================================================
      # 5. Preserve encrypted keystore
      # =========================================================
      - name: Preserve encrypted keystore
        run: |
          set -e

          SOURCE="android/keystore/lifemate-release.jks.enc.b64"

          if [ -f "$SOURCE" ]; then
            cp "$SOURCE" /tmp/lifemate-release.jks.enc.b64
            echo "Encrypted keystore preserved."
          else
            echo "ERROR: Encrypted keystore not found:"
            echo "$SOURCE"
            exit 1
          fi


      # =========================================================
      # 6. Generate Android Project
      # =========================================================
      - name: Generate Android project
        run: |
          set -e

          if [ ! -f android/gradlew ]; then

            echo "Generating Android project..."

            flutter create \
              --platforms=android \
              --project-name lifemate \
              --org com.lifemate \
              /tmp/lifemate_scaffold

            rm -rf android

            cp -R /tmp/lifemate_scaffold/android ./android

            mkdir -p android/keystore

            cp \
              /tmp/lifemate-release.jks.enc.b64 \
              android/keystore/lifemate-release.jks.enc.b64

            echo "Android project generated successfully."

          else

            echo "Android project already exists."

          fi


      # =========================================================
      # 7. Install Android SDK 36
      # =========================================================
      - name: Install Android SDK 36
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager \
            -type f \
            | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: SDK Manager not found."
            exit 1
          fi

          echo "SDK Manager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" "platform-tools"

          "$SDKMANAGER" "platforms;android-36"

          "$SDKMANAGER" "build-tools;36.0.0"

          echo "Android SDK 36 installed successfully."


      # =========================================================
      # 8. Flutter Pub Get
      # =========================================================
      - name: Flutter Pub Get
        run: |
          flutter pub get


      # =========================================================
      # 9. Install LifeMate App Icon
      # =========================================================
      - name: Install LifeMate App Icon
        run: |
          set -e

          ICON_SOURCE="assets/lifemate_icon.png"

          if [ ! -f "$ICON_SOURCE" ]; then
            echo "ERROR: $ICON_SOURCE not found."
            exit 1
          fi

          echo "LifeMate icon found."

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path("assets/lifemate_icon.png")

          if not source.exists():
              raise SystemExit("Icon source not found.")

          image = Image.open(source).convert("RGBA")

          print("Original icon size:", image.size)

          size = max(image.width, image.height)

          canvas = Image.new(
              "RGBA",
              (size, size),
              (0, 0, 0, 0)
          )

          x = (size - image.width) // 2
          y = (size - image.height) // 2

          canvas.alpha_composite(image, (x, y))

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          res = Path("android/app/src/main/res")

          for folder, target_size in sizes.items():

              directory = res / folder

              directory.mkdir(
                  parents=True,
                  exist_ok=True
              )

              resized = canvas.resize(
                  (target_size, target_size),
                  Image.Resampling.LANCZOS
              )

              resized.save(
                  directory / "ic_launcher.png",
                  "PNG"
              )

              resized.save(
                  directory / "ic_launcher_round.png",
                  "PNG"
              )

              print(
                  f"Created {folder}: "
                  f"{target_size}x{target_size}"
              )

          print("LifeMate App Icon generated successfully.")
          PY


      # =========================================================
      # 10. Configure Launcher Icon
      # =========================================================
      - name: Configure Android Launcher Icon
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          content = manifest.read_text()

          content = re.sub(
              r'android:icon="[^"]*"',
              'android:icon="@mipmap/ic_launcher"',
              content
          )

          content = re.sub(
              r'android:roundIcon="[^"]*"',
              'android:roundIcon="@mipmap/ic_launcher_round"',
              content
          )

          if 'android:icon="@mipmap/ic_launcher"' not in content:

              content = content.replace(
                  "<application",
                  '<application\n'
                  '        android:icon="@mipmap/ic_launcher"\n'
                  '        android:roundIcon="@mipmap/ic_launcher_round"',
                  1
              )

          manifest.write_text(content)

          print("Launcher icon configured.")
          PY

          rm -f \
            android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
            android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml \
            2>/dev/null || true

          echo "Launcher icon setup completed."


      # =========================================================
      # 11. Floating Home Button
      # =========================================================
      - name: Install Floating Home Button
        run: |
          set -e

          MAIN_ACTIVITY="android/app/src/main/kotlin/com/lifemate/lifemate/MainActivity.kt"

          FLOATING_SERVICE="android/app/src/main/kotlin/com/lifemate/lifemate/LifeMateFloatingService.kt"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          mkdir -p "$(dirname "$MAIN_ACTIVITY")"


          # -----------------------------------------------------
          # MainActivity.kt
          # -----------------------------------------------------
          cat > "$MAIN_ACTIVITY" <<'KOTLIN'
          package com.lifemate.lifemate

          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {

              private val channelName =
                  "com.lifemate/floating_home"

              private val prefsName =
                  "lifemate_floating"

              private val enabledKey =
                  "enabled"

              private val foregroundKey =
                  "app_foreground"

              override fun configureFlutterEngine(
                  flutterEngine: FlutterEngine
              ) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      channelName
                  ).setMethodCallHandler { call, result ->

                      when (call.method) {

                          "isOverlayPermissionGranted" -> {
                              result.success(
                                  Settings.canDrawOverlays(this)
                              )
                          }

                          "requestOverlayPermission" -> {
                              openOverlaySettings()
                              result.success(true)
                          }

                          "setFloatingEnabled" -> {

                              val enabled =
                                  call.argument<Boolean>("enabled")
                                      ?: false

                              getSharedPreferences(
                                  prefsName,
                                  MODE_PRIVATE
                              )
                                  .edit()
                                  .putBoolean(
                                      enabledKey,
                                      enabled
                                  )
                                  .apply()

                              if (enabled) {

                                  if (
                                      Settings.canDrawOverlays(this)
                                  ) {
                                      startFloatingService()
                                  } else {
                                      openOverlaySettings()
                                  }

                              } else {

                                  stopService(
                                      Intent(
                                          this,
                                          LifeMateFloatingService::class.java
                                      )
                                  )
                              }

                              result.success(true)
                          }

                          else -> {
                              result.notImplemented()
                          }
                      }
                  }
              }

              override fun onResume() {

                  super.onResume()

                  getSharedPreferences(
                      prefsName,
                      MODE_PRIVATE
                  )
                      .edit()
                      .putBoolean(
                          foregroundKey,
                          true
                      )
                      .apply()

                  val enabled =
                      getSharedPreferences(
                          prefsName,
                          MODE_PRIVATE
                      )
                          .getBoolean(
                              enabledKey,
                              false
                          )

                  if (
                      enabled &&
                      Settings.canDrawOverlays(this)
                  ) {
                      startFloatingService()
                  }
              }

              override fun onPause() {

                  getSharedPreferences(
                      prefsName,
                      MODE_PRIVATE
                  )
                      .edit()
                      .putBoolean(
                          foregroundKey,
                          false
                      )
                      .apply()

                  super.onPause()
              }

              override fun onDestroy() {

                  getSharedPreferences(
                      prefsName,
                      MODE_PRIVATE
                  )
                      .edit()
                      .putBoolean(
                          foregroundKey,
                          false
                      )
                      .apply()

                  super.onDestroy()
              }

              private fun openOverlaySettings() {

                  if (
                      Settings.canDrawOverlays(this)
                  ) {
                      return
                  }

                  try {

                      val intent = Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse(
                              "package:$packageName"
                          )
                      )

                      startActivity(intent)

                  } catch (_: Exception) {

                      try {

                          startActivity(
                              Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION
                              )
                          )

                      } catch (_: Exception) {
                      }
                  }
              }

              private fun startFloatingService() {

                  try {

                      val intent = Intent(
                          this,
                          LifeMateFloatingService::class.java
                      )

                      if (
                          Build.VERSION.SDK_INT >=
                          Build.VERSION_CODES.O
                      ) {

                          startForegroundService(intent)

                      } else {

                          startService(intent)
                      }

                  } catch (_: Exception) {
                  }
              }
          }
          KOTLIN


          # -----------------------------------------------------
          # LifeMateFloatingService.kt
          # -----------------------------------------------------
          cat > "$FLOATING_SERVICE" <<'KOTLIN'
          package com.lifemate.lifemate

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.IBinder
          import android.provider.Settings
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.TextView

          class LifeMateFloatingService : Service() {

              private var windowManager: WindowManager? =
                  null

              private var floatingView: TextView? =
                  null

              private val channelId =
                  "lifemate_floating_channel"

              private val notificationId =
                  1001

              private val prefsName =
                  "lifemate_floating"

              private val foregroundKey =
                  "app_foreground"

              override fun onCreate() {

                  super.onCreate()

                  if (!Settings.canDrawOverlays(this)) {

                      stopSelf()

                      return
                  }

                  createNotificationChannel()

                  startForeground(
                      notificationId,
                      createNotification()
                  )

                  showFloatingButton()
              }

              private fun createNotificationChannel() {

                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.O
                  ) {

                      val channel =
                          NotificationChannel(
                              channelId,
                              "LifeMate Floating Button",
                              NotificationManager.IMPORTANCE_LOW
                          )

                      channel.description =
                          "Keeps the LifeMate Home button available."

                      val manager =
                          getSystemService(
                              NotificationManager::class.java
                          )

                      manager.createNotificationChannel(
                          channel
                      )
                  }
              }

              private fun createNotification(): Notification {

                  return if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.O
                  ) {

                      Notification.Builder(
                          this,
                          channelId
                      )
                          .setContentTitle("LifeMate")
                          .setContentText(
                              "Floating Home button is active"
                          )
                          .setSmallIcon(
                              android.R.drawable.ic_menu_view
                          )
                          .setOngoing(true)
                          .build()

                  } else {

                      Notification.Builder(this)
                          .setContentTitle("LifeMate")
                          .setContentText(
                              "Floating Home button is active"
                          )
                          .setSmallIcon(
                              android.R.drawable.ic_menu_view
                          )
                          .setOngoing(true)
                          .build()
                  }
              }

              private fun showFloatingButton() {

                  if (floatingView != null) {
                      return
                  }

                  windowManager =
                      getSystemService(
                          WINDOW_SERVICE
                      ) as WindowManager

                  val button = TextView(this)

                  button.text = "⌂"

                  button.textSize = 22f

                  button.setTextColor(
                      Color.WHITE
                  )

                  button.gravity =
                      Gravity.CENTER

                  button.setPadding(
                      0,
                      0,
                      0,
                      1
                  )

                  val background =
                      GradientDrawable()

                  background.shape =
                      GradientDrawable.OVAL

                  background.setColor(
                      Color.rgb(
                          33,
                          150,
                          243
                      )
                  )

                  background.setStroke(
                      2,
                      Color.WHITE
                  )

                  button.background =
                      background

                  button.elevation = 12f

                  val params =
                      WindowManager.LayoutParams(

                          dp(52),

                          dp(52),

                          if (
                              Build.VERSION.SDK_INT >=
                              Build.VERSION_CODES.O
                          ) {

                              WindowManager.LayoutParams
                                  .TYPE_APPLICATION_OVERLAY

                          } else {

                              WindowManager.LayoutParams
                                  .TYPE_PHONE
                          },

                          WindowManager.LayoutParams
                              .FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams
                                  .FLAG_LAYOUT_NO_LIMITS,

                          PixelFormat.TRANSLUCENT
                      )

                  params.gravity =
                      Gravity.CENTER_VERTICAL or
                      Gravity.END

                  params.x = dp(4)

                  params.y = 0

                  button.setOnTouchListener(
                      object : View.OnTouchListener {

                          private var downX = 0f
                          private var downY = 0f
                          private var startX = 0
                          private var startY = 0
                          private var moved = false

                          override fun onTouch(
                              view: View,
                              event: MotionEvent
                          ): Boolean {

                              when (event.action) {

                                  MotionEvent.ACTION_DOWN -> {

                                      downX = event.rawX
                                      downY = event.rawY

                                      startX = params.x
                                      startY = params.y

                                      moved = false

                                      return true
                                  }

                                  MotionEvent.ACTION_MOVE -> {

                                      val dx =
                                          event.rawX - downX

                                      val dy =
                                          event.rawY - downY

                                      if (
                                          kotlin.math.abs(dx) >
                                              dp(8) ||
                                          kotlin.math.abs(dy) >
                                              dp(8)
                                      ) {
                                          moved = true
                                      }

                                      params.x =
                                          startX -
                                          dx.toInt()

                                      params.y =
                                          startY +
                                          dy.toInt()

                                      try {

                                          windowManager
                                              ?.updateViewLayout(
                                                  button,
                                                  params
                                              )

                                      } catch (_: Exception) {
                                      }

                                      return true
                                  }

                                  MotionEvent.ACTION_UP -> {

                                      if (!moved) {
                                          handleFloatingTap()
                                      }

                                      return true
                                  }
                              }

                              return false
                          }
                      }
                  )

                  floatingView = button

                  try {

                      windowManager?.addView(
                          button,
                          params
                      )

                  } catch (_: Exception) {

                      floatingView = null
                  }
              }

              private fun handleFloatingTap() {

                  val isAppForeground =
                      getSharedPreferences(
                          prefsName,
                          MODE_PRIVATE
                      )
                          .getBoolean(
                              foregroundKey,
                              false
                          )

                  if (isAppForeground) {

                      goToBackground()

                  } else {

                      openLifeMate
