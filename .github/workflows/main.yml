name: Build LifeMate APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Flutter
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # --------------------------------------------------
      # 4. Generate Android project if missing
      # --------------------------------------------------
      - name: Generate Android project
        run: |
          if [ ! -f android/gradlew ]; then
            echo "Android project not found. Generating..."

            flutter create \
              --platforms=android \
              --project-name lifemate \
              --org com.lifemate \
              /tmp/lifemate_scaffold

            rm -rf android
            cp -R /tmp/lifemate_scaffold/android ./android

            echo "Android project generated."
          else
            echo "Android project already exists."
          fi

      # --------------------------------------------------
      # 5. Install Android SDK 36
      # --------------------------------------------------
      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager \
            -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "SDK Manager not found"
            exit 1
          fi

          echo "Using SDK Manager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-36"
          "$SDKMANAGER" "build-tools;36.0.0"

      # --------------------------------------------------
      # 6. Flutter dependencies
      # --------------------------------------------------
      - name: Flutter Pub Get
        run: |
          flutter pub get

      # --------------------------------------------------
      # 7. Force App compileSdk = 36
      # --------------------------------------------------
      - name: Force App compileSdk 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          for file in files:
              if not file.exists():
                  continue

              content = file.read_text()

              # Replace existing compileSdk values
              content = re.sub(
                  r'(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(?:flutter\.compileSdkVersion|\d+)',
                  r'\g<1>36',
                  content
              )

              # If compileSdk does not exist, add it
              if not re.search(r'compileSdk(?:Version)?', content):
                  content = content.replace(
                      "android {",
                      "android {\n    compileSdk 36",
                      1
                  )

              file.write_text(content)

              print("Updated:", file)
          PY

      # --------------------------------------------------
      # 8. Force Flutter plugin Android compileSdk = 36
      # --------------------------------------------------
      - name: Force Flutter plugin compileSdk 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import os

          roots = [
              Path(os.path.expanduser(
                  "~/.pub-cache/hosted/pub.dev"
              )),
              Path(".dart_tool/package_config.json").parent
          ]

          changed = []

          # Specifically target the plugins involved in the error
          target_names = [
              "file_picker",
              "flutter_plugin_android_lifecycle",
          ]

          pub_root = roots[0]

          if pub_root.exists():
              for name in target_names:
                  for folder in pub_root.glob(f"{name}-*"):
                      android_folder = folder / "android"

                      if not android_folder.exists():
                          continue

                      for file in android_folder.glob("build.gradle*"):
                          content = file.read_text()

                          updated = re.sub(
                              r'(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(?:flutter\.compileSdkVersion|\d+)',
                              r'\g<1>36',
                              content
                          )

                          if not re.search(
                              r'compileSdk(?:Version)?',
                              updated
                          ):
                              updated = (
                                  "android {\n"
                                  "    compileSdk 36\n"
                                  + updated
                              )

                          if updated != content:
                              file.write_text(updated)
                              changed.append(str(file))

          print("Plugin Gradle files updated:")

          for item in changed:
              print(item)

          print(
              "Total plugin files updated:",
              len(changed)
          )
          PY

      # --------------------------------------------------
      # 9. Verify compileSdk
      # --------------------------------------------------
      - name: Verify compileSdk
        run: |
          echo "========================================"
          echo "APP BUILD GRADLE"
          echo "========================================"

          cat android/app/build.gradle || true

          echo ""
          echo "========================================"
          echo "FILE PICKER GRADLE"
          echo "========================================"

          find ~/.pub-cache/hosted/pub.dev \
            -path "*file_picker*/android/build.gradle*" \
            -print \
            -exec cat {} \; || true

          echo ""
          echo "========================================"
          echo "FLUTTER PLUGIN ANDROID LIFECYCLE"
          echo "========================================"

          find ~/.pub-cache/hosted/pub.dev \
            -path "*flutter_plugin_android_lifecycle*/android/build.gradle*" \
            -print \
            -exec cat {} \; || true

      # --------------------------------------------------
      # 10. Clean Flutter
      # --------------------------------------------------
      - name: Flutter Clean
        run: |
          flutter clean

      # --------------------------------------------------
      # 11. Get dependencies again
      # --------------------------------------------------
      - name: Flutter Pub Get Again
        run: |
          flutter pub get

      # --------------------------------------------------
      # 12. Build APK
      # --------------------------------------------------
      - name: Build APK
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.parallel=true
            -Dorg.gradle.caching=true
        run: |
          flutter build apk --release

      # --------------------------------------------------
      # 13. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeMate-APK
          path: build/app/outputs/flutter-apk/app-release.apk
