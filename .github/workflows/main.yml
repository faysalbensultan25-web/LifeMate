name: Build LifeMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create \
              --platforms=android \
              --project-name lifemate \
              --org com.lifemate \
              /tmp/lifemate_scaffold

            rm -rf android
            cp -R /tmp/lifemate_scaffold/android ./android
          fi

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "SDK Manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-36"
          "$SDKMANAGER" "build-tools;36.0.0"

      - name: Force compileSdk 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          for file in files:
              if not file.exists():
                  continue

              content = file.read_text()

              content = re.sub(
                  r'(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(?:flutter\.compileSdkVersion|\d+)',
                  r'\g<1>36',
                  content
              )

              if "compileSdk" not in content:
                  content = content.replace(
                      "android {",
                      "android {\n    compileSdk 36",
                      1
                  )

              file.write_text(content)
              print("Updated:", file)

      - name: Flutter clean
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Verify compileSdk configuration
        run: |
          echo "===== APP BUILD GRADLE ====="
          cat android/app/build.gradle || true

          echo "===== SEARCH COMPILE SDK ====="
          grep -R "compileSdk" android ~/.pub-cache/hosted/pub.dev/file_picker* ~/.pub-cache/hosted/pub.dev/flutter_plugin_android_lifecycle* 2>/dev/null || true

      - name: Build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
        run: |
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeMate-APK
          path: build/app/outputs/flutter-apk/app-release.apk
