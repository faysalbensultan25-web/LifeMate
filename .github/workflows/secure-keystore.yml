
name: Store LifeMate Secure Keystore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  secure-keystore:
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate stable LifeMate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.LIFEMATE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.LIFEMATE_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: LIFEMATE_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: LIFEMATE_KEY_PASSWORD is missing."
            exit 1
          fi

          mkdir -p android/keystore

          keytool -genkeypair \
            -v \
            -keystore lifemate-release.jks \
            -alias lifemate \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=LifeMate, OU=Mobile, O=LifeMate, L=Bangladesh, C=BD"

          echo "Keystore generated."

      - name: Encrypt keystore
        env:
          ENCRYPTION_PASSWORD: ${{ secrets.LIFEMATE_KEYSTORE_ENCRYPTION_PASSWORD }}
        run: |
          set -e

          if [ -z "$ENCRYPTION_PASSWORD" ]; then
            echo "ERROR: LIFEMATE_KEYSTORE_ENCRYPTION_PASSWORD is missing."
            exit 1
          fi

          openssl enc \
            -aes-256-cbc \
            -pbkdf2 \
            -salt \
            -in lifemate-release.jks \
            -out lifemate-release.jks.enc \
            -pass env:ENCRYPTION_PASSWORD

          base64 -w 0 lifemate-release.jks.enc \
            > android/keystore/lifemate-release.jks.enc.b64

          rm -f lifemate-release.jks
          rm -f lifemate-release.jks.enc

          echo "Encrypted keystore created."

      - name: Create keystore README
        run: |
          cat > android/keystore/README.md <<'EOF'
          # LifeMate Release Keystore

          This directory contains the encrypted LifeMate release keystore.

          The actual `.jks` file is never stored in the repository.

          The encrypted keystore is decrypted only inside GitHub Actions
          during the signed release build.

          DO NOT remove or rename the encrypted keystore file.
          EOF

      - name: Commit encrypted keystore
        run: |
          set -e

          git config user.name "LifeMate Release Bot"
          git config user.email "actions@github.com"

          git add android/keystore/lifemate-release.jks.enc.b64
          git add android/keystore/README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Add encrypted LifeMate release keystore"
          git push

          echo "Encrypted keystore committed successfully."
