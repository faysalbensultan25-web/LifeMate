name: Generate LifeMate Secure Release Keystore

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Secure Release Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.LIFEMATE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.LIFEMATE_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: LIFEMATE_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: LIFEMATE_KEY_PASSWORD is missing."
            exit 1
          fi

          keytool -genkeypair \
            -v \
            -keystore lifemate-release.jks \
            -alias lifemate \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=LifeMate, OU=Mobile, O=LifeMate, L=Bangladesh, C=BD"

          echo "Secure LifeMate release keystore created."

      - name: Upload Secure Keystore
        uses: actions/upload-artifact@v4
        with:
          name: lifemate-secure-release-keystore
          path: lifemate-release.jks
          retention-days: 1
