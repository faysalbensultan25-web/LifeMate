name: Generate LifeMate Release Keystore

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Release Keystore
        run: |
          set -e

          keytool -genkeypair \
            -v \
            -keystore lifemate-release.jks \
            -alias lifemate \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "LifeMateStore2026!" \
            -keypass "LifeMateKey2026!" \
            -dname "CN=LifeMate, OU=Mobile, O=LifeMate, L=Bangladesh, C=BD"

          echo "Keystore generated successfully."

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: lifemate-release-keystore
          path: lifemate-release.jks
          retention-days: 1
